<th:block th:fragment="layout(contenido, seccionActiva)">
<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Almacén · Control de Inventario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/spotify-theme.css}">
</head>
<body>
    <!-- Topbar para móviles -->
    <header class="mobile-topbar d-lg-none navbar navbar-dark bg-black px-3 py-2 sticky-top border-bottom border-dark">
        <button class="navbar-toggler p-1 border-0" type="button" id="sidebarToggle">
            <span class="navbar-toggler-icon"></span>
        </button>
        <span class="navbar-brand fw-bold mb-0 text-white d-flex align-items-center gap-2">
            <i class="bi bi-box-seam-fill text-success"></i> Almacén
        </span>
        <div class="dropdown">
            <button class="btn btn-sm btn-outline-light rounded-circle p-2" type="button" data-bs-toggle="dropdown">
                <i class="bi bi-person-fill"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow dropdown-menu-dark">
                <li class="dropdown-item-text small text-secondary" th:text="${usuarioActual}">usuario</li>
                <li><hr class="dropdown-divider border-secondary"></li>
                <li>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button class="dropdown-item text-danger" type="submit">
                            <i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </header>

    <!-- Barra Lateral Estilo Spotify -->
    <aside class="app-sidebar d-flex flex-column" id="appSidebar">
        <a th:href="@{/productos}" class="sidebar-brand">
            <i class="bi bi-disc-fill"></i>
            <span>Almacén</span>
        </a>

        <div class="sidebar-nav flex-grow-1">
            <div class="nav-category">Inventario</div>
            <a th:href="@{/productos}" class="sidebar-link" th:classappend="${seccionActiva == 'productos'} ? ' active' : ''">
                <i class="bi bi-boxes"></i>
                <span>Productos</span>
            </a>
            <a th:href="@{/movimientos}" class="sidebar-link" th:classappend="${seccionActiva == 'movimientos'} ? ' active' : ''">
                <i class="bi bi-arrow-left-right"></i>
                <span>Movimientos</span>
            </a>

            <div class="nav-category">Catálogos</div>
            <a th:href="@{/categorias}" class="sidebar-link" th:classappend="${seccionActiva == 'categorias'} ? ' active' : ''">
                <i class="bi bi-tags"></i>
                <span>Categorías</span>
            </a>
            <a th:href="@{/proveedores}" class="sidebar-link" th:classappend="${seccionActiva == 'proveedores'} ? ' active' : ''">
                <i class="bi bi-truck"></i>
                <span>Proveedores</span>
            </a>

            <th:block th:if="${esAdmin}">
                <div class="nav-category">Administración</div>
                <a th:href="@{/usuarios}" class="sidebar-link" th:classappend="${seccionActiva == 'usuarios'} ? ' active' : ''">
                    <i class="bi bi-people"></i>
                    <span>Usuarios</span>
                </a>
            </th:block>
        </div>

        <div class="sidebar-footer">
            <div class="d-flex align-items-center justify-content-between mb-2">
                <a th:href="@{/perfil}" class="text-decoration-none overflow-hidden me-2" title="Ver mi perfil y cambiar contraseña">
                    <div class="small fw-semibold text-truncate text-white d-flex align-items-center gap-1">
                        <i class="bi bi-person-circle text-success"></i>
                        <span th:text="${usuarioActual}">usuario@correo.com</span>
                    </div>
                    <div class="mt-1">
                        <span th:if="${esAdmin}" class="badge text-bg-success">ADMIN</span>
                        <span th:unless="${esAdmin}" class="badge text-bg-secondary">EMPLEADO</span>
                        <span class="text-secondary ms-1" style="font-size: 0.75rem;"><i class="bi bi-key me-1"></i>Cambiar clave</span>
                    </div>
                </a>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button class="btn btn-outline-danger btn-sm p-1 px-2 rounded-circle" type="submit" title="Cerrar sesión">
                        <i class="bi bi-box-arrow-right"></i>
                    </button>
                </form>
            </div>
        </div>
    </aside>

    <!-- Contenedor Principal (Panel curvado oscuro tipo Spotify) -->
    <div class="app-main">
        <div class="main-content-wrapper">
            <th:block th:replace="${contenido}" />
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
        const sidebarToggle = document.getElementById('sidebarToggle');
        const appSidebar = document.getElementById('appSidebar');
        if (sidebarToggle && appSidebar) {
            sidebarToggle.addEventListener('click', () => {
                appSidebar.classList.toggle('show');
            });
            document.addEventListener('click', (e) => {
                if (window.innerWidth < 992 && 
                    !appSidebar.contains(e.target) && 
                    !sidebarToggle.contains(e.target) && 
                    appSidebar.classList.contains('show')) {
                    appSidebar.classList.remove('show');
                }
            });
        }
    </script>
</body>
</html>
</th:block>

<th:block th:fragment="barra">
    <div class="alert alert-warning m-0">Navegación actualizada a barra lateral.</div>
</th:block>
