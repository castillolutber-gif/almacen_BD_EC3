<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/nav :: layout(~{::main}, 'categorias')}">
<head>
    <title>Categoría · Almacén</title>
</head>
<body>
<main class="container py-4 py-lg-5">
    <div class="mb-4">
        <a th:href="@{/categorias}" class="text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Volver a Categorías</a>
        <h1 class="h2 mt-3" th:text="${form.id == null} ? 'Nueva categoría' : 'Editar categoría'">Nueva categoría</h1>
    </div>
    <div class="card border-0 shadow-sm"><div class="card-body p-4">
        <form th:action="@{/categorias/guardar}" th:object="${form}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="row g-3">
                <div class="col-12"><label for="nombre" class="form-label">Nombre</label>
                    <input id="nombre" class="form-control" th:field="*{nombre}" maxlength="80" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div></div>
                <div class="col-12"><label for="descripcion" class="form-label">Descripción</label>
                    <textarea id="descripcion" class="form-control" th:field="*{descripcion}" rows="3" maxlength="200"></textarea>
                    <div class="text-danger small" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></div></div>
                <div class="col-12 form-check ms-2" th:if="${form.id != null}">
                    <input id="estado" class="form-check-input" type="checkbox" th:field="*{estado}">
                    <label for="estado" class="form-check-label">Categoría activa</label>
                </div>
            </div>
            <div class="d-flex gap-2 mt-4"><button class="btn btn-primary" type="submit">Guardar</button>
                <a class="btn btn-outline-secondary" th:href="@{/categorias}">Cancelar</a></div>
        </form>
    </div></div>
</main>
</body>
</html>
