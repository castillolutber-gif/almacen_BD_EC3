<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear cuenta · Almacén</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/spotify-theme.css}">
    <style>
        body {
            background: radial-gradient(circle at top, #1f3724 0%, #000000 65%);
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5">
<main class="container d-flex justify-content-center">
    <div class="card p-4 p-md-5 shadow-lg" style="width: min(100%, 480px); border-radius: 1rem;">
        <div class="text-center mb-4">
            <i class="bi bi-disc-fill text-success" style="font-size: 3.2rem;"></i>
            <h1 class="h3 fw-bold text-white mt-3 mb-1">Crea tu cuenta</h1>
            <p class="text-secondary small">Regístrate para acceder al sistema de inventario</p>
        </div>

        <form th:action="@{/registro}" th:object="${form}" method="post">
            <div class="mb-3">
                <label for="nombre" class="form-label small text-secondary fw-semibold">Nombre completo</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input id="nombre" th:field="*{nombre}" type="text" class="form-control"
                           placeholder="Tu nombre y apellido" required autofocus>
                </div>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
            </div>

            <div class="mb-3">
                <label for="correo" class="form-label small text-secondary fw-semibold">Correo electrónico</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input id="correo" th:field="*{correo}" type="email" class="form-control"
                           placeholder="tu-correo@ejemplo.com" required>
                </div>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label small text-secondary fw-semibold">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input id="password" th:field="*{password}" type="password" class="form-control"
                           placeholder="Mínimo 6 caracteres" required>
                </div>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>

            <div class="mb-4">
                <label for="confirmarPassword" class="form-label small text-secondary fw-semibold">Confirmar contraseña</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                    <input id="confirmarPassword" th:field="*{confirmarPassword}" type="password" class="form-control"
                           placeholder="Repite la contraseña" required>
                </div>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('confirmarPassword')}" th:errors="*{confirmarPassword}"></div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fs-6 mb-3">
                Registrarse
            </button>
        </form>

        <div class="text-center border-top border-secondary pt-3 mt-2">
            <span class="text-secondary small">¿Ya tienes una cuenta? </span>
            <a th:href="@{/login}" class="text-success small fw-semibold text-decoration-none">
                Iniciar sesión
            </a>
        </div>
    </div>
</main>
</body>
</html>
