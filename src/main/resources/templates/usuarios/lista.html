<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Usuarios · Almacén</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">
<div th:replace="~{fragments/nav :: barra}"></div>
<main class="container py-4 py-lg-5">
    <div th:replace="~{fragments/alertas :: mensajes}"></div>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div><p class="text-primary fw-semibold mb-1">ADMINISTRACIÓN</p><h1 class="h2 mb-0">Usuarios</h1></div>
        <a th:href="@{/usuarios/nuevo}" class="btn btn-primary">Nuevo usuario</a>
    </div>

    <!-- Barra de Búsqueda y Filtros -->
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body p-3">
            <div class="row g-3 align-items-center">
                <div class="col-md-5">
                    <label for="buscarUsuario" class="visually-hidden">Buscar</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white text-muted">🔍</span>
                        <input type="text" id="buscarUsuario" class="form-control" placeholder="Buscar usuario por nombre o correo...">
                    </div>
                </div>
                <div class="col-md-3">
                    <label for="filtroRol" class="visually-hidden">Rol</label>
                    <select id="filtroRol" class="form-select">
                        <option value="">Todos los roles</option>
                        <option value="ADMIN">ADMIN</option>
                        <option value="EMPLEADO">EMPLEADO</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="filtroEstado" class="visually-hidden">Estado</label>
                    <select id="filtroEstado" class="form-select">
                        <option value="">Todos los estados</option>
                        <option value="activo">Solo Activos</option>
                        <option value="inactivo">Solo Inactivos</option>
                    </select>
                </div>
                <div class="col-md-1">
                    <button type="button" id="btnLimpiar" class="btn btn-outline-secondary w-100" title="Limpiar filtros">Borrar</button>
                </div>
            </div>
            <div class="mt-2 text-secondary small d-flex justify-content-between align-items-center">
                <span id="contadorResultados">Mostrando todos los usuarios</span>
            </div>
        </div>
    </div>

    <div class="card border-0 shadow-sm"><div class="table-responsive">
        <table class="table table-hover align-middle mb-0" id="tablaUsuarios">
            <thead class="table-light"><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Estado</th><th class="text-end">Acciones</th></tr></thead>
            <tbody id="cuerpoTablaUsuarios">
            <tr th:each="usuario : ${usuarios}"
                class="fila-usuario"
                th:attr="data-nombre=${#strings.toLowerCase(usuario.nombre)},
                         data-correo=${#strings.toLowerCase(usuario.correo)},
                         data-rol=${usuario.rol},
                         data-estado=${usuario.estado ? 'activo' : 'inactivo'}">
                <td class="fw-semibold" th:text="${usuario.nombre}">Usuario</td>
                <td th:text="${usuario.correo}">correo@ejemplo.com</td>
                <td><span class="badge text-bg-primary" th:text="${usuario.rol}">EMPLEADO</span></td>
                <td><span class="badge" th:classappend="${usuario.estado} ? ' text-bg-success' : ' text-bg-secondary'"
                          th:text="${usuario.estado} ? 'Activo' : 'Inactivo'">Activo</span></td>
                <td class="text-end text-nowrap">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/usuarios/{id}/editar(id=${usuario.id})}">Editar</a>
                    <form class="d-inline" th:action="@{/usuarios/{id}/estado(id=${usuario.id})}" method="post">
                        <button class="btn btn-sm btn-outline-secondary" type="submit"
                                th:text="${usuario.estado} ? 'Desactivar' : 'Activar'">Desactivar</button>
                    </form>
                </td>
            </tr>
            <tr id="filaSinCoincidencias" class="d-none">
                <td colspan="5" class="text-center text-secondary py-5">
                    No se encontraron usuarios que coincidan con la búsqueda.
                </td>
            </tr>
            </tbody>
        </table>
    </div></div>
    <p class="form-text mt-3">Las contraseñas nunca se muestran; puedes establecer una nueva al editar una cuenta.</p>
</main>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const inputBuscar = document.getElementById('buscarUsuario');
        const selectRol = document.getElementById('filtroRol');
        const selectEstado = document.getElementById('filtroEstado');
        const btnLimpiar = document.getElementById('btnLimpiar');
        const filas = Array.from(document.querySelectorAll('#cuerpoTablaUsuarios .fila-usuario'));
        const filaSinCoincidencias = document.getElementById('filaSinCoincidencias');
        const contador = document.getElementById('contadorResultados');
        const total = filas.length;

        function filtrar() {
            const texto = inputBuscar.value.trim().toLowerCase();
            const rol = selectRol.value;
            const estado = selectEstado.value;

            let visibles = 0;
            filas.forEach(fila => {
                const nombre = fila.dataset.nombre || '';
                const correo = fila.dataset.correo || '';
                const filaRol = fila.dataset.rol || '';
                const filaEstado = fila.dataset.estado || '';

                const coincideTexto = !texto || nombre.includes(texto) || correo.includes(texto);
                const coincideRol = !rol || filaRol === rol;
                const coincideEstado = !estado || filaEstado === estado;

                if (coincideTexto && coincideRol && coincideEstado) {
                    fila.classList.remove('d-none');
                    visibles++;
                } else {
                    fila.classList.add('d-none');
                }
            });

            if (filaSinCoincidencias) {
                if (visibles === 0 && total > 0) {
                    filaSinCoincidencias.classList.remove('d-none');
                } else {
                    filaSinCoincidencias.classList.add('d-none');
                }
            }

            if (contador) {
                if (visibles === total) {
                    contador.textContent = `Mostrando todos los usuarios (${total})`;
                } else {
                    contador.textContent = `Mostrando ${visibles} de ${total} usuarios`;
                }
            }
        }

        inputBuscar.addEventListener('input', filtrar);
        selectRol.addEventListener('change', filtrar);
        selectEstado.addEventListener('change', filtrar);

        btnLimpiar.addEventListener('click', function () {
            inputBuscar.value = '';
            selectRol.value = '';
            selectEstado.value = '';
            filtrar();
        });

        filtrar();
    });
</script>
</body>
</html>
