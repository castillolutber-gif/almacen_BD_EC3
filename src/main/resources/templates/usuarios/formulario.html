<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/nav :: layout(~{::main}, 'usuarios')}">
<head>
    <title>Usuario · Almacén</title>
</head>
<body>
<main class="container py-4 py-lg-5">
    <div class="mb-4">
        <a th:href="@{/usuarios}" class="text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Volver a Usuarios</a>
        <h1 class="h2 mt-3" th:text="${form.id == null} ? 'Nuevo usuario' : 'Editar usuario'">Nuevo usuario</h1>
    </div>
    <div class="card border-0 shadow-sm"><div class="card-body p-4">
        <form th:action="@{/usuarios/guardar}" th:object="${form}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="row g-3">
                <div class="col-md-6"><label for="nombre" class="form-label">Nombre completo</label>
                    <input id="nombre" class="form-control" th:field="*{nombre}" maxlength="100" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div></div>
                <div class="col-md-6"><label for="correo" class="form-label">Correo electrónico</label>
                    <input id="correo" class="form-control" type="email" th:field="*{correo}" maxlength="120" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></div></div>
                <div class="col-md-6"><label for="password" class="form-label"
                                             th:text="${form.id == null} ? 'Contraseña' : 'Nueva contraseña (opcional)'">Contraseña</label>
                    <input id="password" class="form-control" type="password" th:field="*{password}" minlength="6" maxlength="100"
                           th:required="${form.id == null}">
                    <div class="form-text" th:if="${form.id != null}">Déjala en blanco si deseas conservar la contraseña actual.</div>
                    <div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div></div>
                <div class="col-md-6"><label for="rol" class="form-label">Rol del usuario</label>
                    <select id="rol" class="form-select" th:field="*{rol}" required>
                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                    </select>
                    <div class="text-danger small" th:if="${#fields.hasErrors('rol')}" th:errors="*{rol}"></div></div>
                <div class="col-12 form-check ms-2" th:if="${form.id != null}">
                    <input id="estado" class="form-check-input" type="checkbox" th:field="*{estado}">
                    <label for="estado" class="form-check-label">Usuario activo</label>
                </div>
            </div>
            <div class="d-flex gap-2 mt-4"><button class="btn btn-primary" type="submit">Guardar</button>
                <a class="btn btn-outline-secondary" th:href="@{/usuarios}">Cancelar</a></div>
        </form>
    </div></div>
</main>
</body>
</html>
