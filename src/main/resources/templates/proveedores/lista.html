<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Proveedores · Almacén</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">
<div th:replace="~{fragments/nav :: barra}"></div>
<main class="container py-4 py-lg-5">
    <div th:replace="~{fragments/alertas :: mensajes}"></div>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div><p class="text-primary fw-semibold mb-1">CATÁLOGOS</p><h1 class="h2 mb-0">Proveedores</h1></div>
        <a th:if="${esAdmin}" th:href="@{/proveedores/nuevo}" class="btn btn-primary">Nuevo proveedor</a>
    </div>

    <!-- Barra de Búsqueda -->
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body p-3">
            <div class="row g-3 align-items-center">
                <div class="col-md-10">
                    <label for="buscarProveedor" class="visually-hidden">Buscar</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white text-muted">🔍</span>
                        <input type="text" id="buscarProveedor" class="form-control" placeholder="Buscar proveedor por razón social, RUC, teléfono o correo...">
                    </div>
                </div>
                <div class="col-md-2">
                    <button type="button" id="btnLimpiar" class="btn btn-outline-secondary w-100" title="Limpiar filtro">Borrar</button>
                </div>
            </div>
            <div class="mt-2 text-secondary small d-flex justify-content-between align-items-center">
                <span id="contadorResultados">Mostrando todos los proveedores</span>
            </div>
        </div>
    </div>

    <div class="card border-0 shadow-sm"><div class="table-responsive">
        <table class="table table-hover align-middle mb-0" id="tablaProveedores">
            <thead class="table-light"><tr><th>Razón social</th><th>RUC</th><th>Teléfono</th><th>Correo</th><th th:if="${esAdmin}" class="text-end">Acciones</th></tr></thead>
            <tbody id="cuerpoTablaProveedores">
            <tr th:each="proveedor : ${proveedores}"
                class="fila-proveedor"
                th:attr="data-razonsocial=${#strings.toLowerCase(proveedor.razonSocial)},
                         data-ruc=${#strings.toLowerCase(proveedor.ruc ?: '')},
                         data-telefono=${#strings.toLowerCase(proveedor.telefono ?: '')},
                         data-correo=${#strings.toLowerCase(proveedor.correo ?: '')}">
                <td class="fw-semibold" th:text="${proveedor.razonSocial}">Empresa</td>
                <td th:text="${proveedor.ruc ?: '—'}">—</td>
                <td th:text="${proveedor.telefono ?: '—'}">—</td>
                <td th:text="${proveedor.correo ?: '—'}">—</td>
                <td th:if="${esAdmin}" class="text-end"><a class="btn btn-sm btn-outline-primary" th:href="@{/proveedores/{id}/editar(id=${proveedor.id})}">Editar</a></td>
            </tr>
            <tr id="filaSinCoincidencias" class="d-none">
                <td colspan="5" class="text-center text-secondary py-5">
                    No se encontraron proveedores que coincidan con la búsqueda.
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(proveedores)}"><td colspan="5" class="text-center text-secondary py-5">Aún no hay proveedores.</td></tr>
            </tbody>
        </table>
    </div></div>
    <p class="form-text mt-3">Los proveedores se conservan para mantener el historial de movimientos.</p>
</main>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const inputBuscar = document.getElementById('buscarProveedor');
        const btnLimpiar = document.getElementById('btnLimpiar');
        const filas = Array.from(document.querySelectorAll('#cuerpoTablaProveedores .fila-proveedor'));
        const filaSinCoincidencias = document.getElementById('filaSinCoincidencias');
        const contador = document.getElementById('contadorResultados');
        const total = filas.length;

        function filtrar() {
            const texto = inputBuscar.value.trim().toLowerCase();

            let visibles = 0;
            filas.forEach(fila => {
                const razon = fila.dataset.razonsocial || '';
                const ruc = fila.dataset.ruc || '';
                const tel = fila.dataset.telefono || '';
                const correo = fila.dataset.correo || '';

                const coincideTexto = !texto || razon.includes(texto) || ruc.includes(texto) ||
                    tel.includes(texto) || correo.includes(texto);

                if (coincideTexto) {
                    fila.classList.remove('d-none');
                    visibles++;
                } else {
                    fila.classList.add('d-none');
                }
            });

            if (filaSinCoincidencias) {
                if (visibles === 0 && total > 0) {
                    filaSinCoincidencias.classList.remove('d-none');
                } else {
                    filaSinCoincidencias.classList.add('d-none');
                }
            }

            if (contador) {
                if (visibles === total) {
                    contador.textContent = `Mostrando todos los proveedores (${total})`;
                } else {
                    contador.textContent = `Mostrando ${visibles} de ${total} proveedores`;
                }
            }
        }

        inputBuscar.addEventListener('input', filtrar);
        btnLimpiar.addEventListener('click', function () {
            inputBuscar.value = '';
            filtrar();
        });

        filtrar();
    });
</script>
</body>
</html>
